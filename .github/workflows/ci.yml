name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      # type check (tsc) and production bundle (uses .env.production)
      - run: npm run build

      - name: Keep the bundle for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 1

  # publishes the tested bundle from master to the gh-pages branch, like `npm run deploy`
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # a newer deployment waits for the running one instead of overwriting it halfway
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      # gh-pages --user rejects "[bot]" (not a valid RFC 5322 address), so the identity comes from git config
      - name: Set git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx gh-pages --dist build
          --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          --message "Deploy ${{ github.sha }}"
